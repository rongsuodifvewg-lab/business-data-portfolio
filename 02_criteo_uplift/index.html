<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criteo Uplift 分析</title><style>body{max-width:900px;margin:36px auto;padding:0 22px;font-family:"Segoe UI","Microsoft YaHei",sans-serif;color:#243447;line-height:1.65}h1,h2{color:#173f67}img{max-width:100%;margin:10px 0}a{color:#1f6598}</style></head><body><p><a href="../index.html">返回作品集</a></p><h1>广告投放增量建模与用户分层</h1><p><b>业务问题：</b>预算有限时，哪些用户更可能因广告而增加访问？</p><h2>样本结果</h2><ul><li>使用 Criteo 官方 uplift 数据的 5,000 行真实样本。</li><li>样本处理组访问率约 4.40%，控制组约 3.88%，差异约 +0.53 个百分点，区间跨过 0。</li><li>使用处理组/控制组 T-learner 生成 uplift 排名，并把高 uplift 人群作为下一轮实验候选。</li></ul><p><b>边界：</b>样本结果不能外推为全量数据效果，不能直接替代真实预算决策。</p><img src="results/uplift_decile_curve.png" alt="uplift分层诊断"><p><a href="EXECUTIVE_REPORT.md">执行摘要</a> · <a href="README.md">复现说明</a> · <a href="src/analyze_criteo.py">Python脚本</a> · <a href="sql/analysis.sql">SQL</a></p></body></html>
